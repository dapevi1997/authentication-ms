apply plugin: 'org.springframework.boot'

dependencies {
	implementation 'com.github.bancolombia:aws-secrets-manager-async:4.4.34'
	implementation project(':metrics')
	implementation 'software.amazon.awssdk:sts'
	implementation project(':logger')
	implementation project(':custom-mapper')
	implementation 'org.reactivecommons.utils:object-mapper:0.1.0'
	implementation project(':r2dbc-mysql')
	implementation project(':request-validator')
	implementation project(':reactive-web')
    implementation project(':model')
    implementation project(':usecase')
    implementation 'org.springframework.boot:spring-boot-starter'
    runtimeOnly('org.springframework.boot:spring-boot-devtools')
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor  "org.projectlombok:lombok:${lombokVersion}"
    testCompileOnly  "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor  "org.projectlombok:lombok:${lombokVersion}"
    testImplementation 'com.tngtech.archunit:archunit:1.4.1'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind'
}

tasks.register('explodedJar', Copy) {
    with jar
    into layout.buildDirectory.dir("exploded")
}

jar {
    // To disable the *-plain.jar
    enabled = false
}

bootJar {
    // Sets output jar name
    //destinationDirectory = layout.settingsDirectory.dir("deployment")
    archiveFileName = "${project.getParent().getName()}.${archiveExtension.get()}"
}