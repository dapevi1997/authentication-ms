server:
  port: 8080
  error:
    include-message: always
spring:
  application:
    name: "AuthenticationMS"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
routes:
  paths:
    saveUser: "/api/v1/usuarios"
    login: "/api/v1/login"
    findUserByEmail: "/api/v1/usuarios"
springdoc:
  swagger-ui:
    path: "/swagger-docs"
  api-docs:
    path: "/api-docs"
    groups:
      enabled: true
adapters:
  r2dbc:
    host: "localhost"
    port: 3306
    database: "authentication"
    schema: "V1__Init-database-dev.sql"
    username: "root"
    password: "password"
flyway:
  enabled: true
  baseline-on-migrate: true
  locations: "classpath:db/migration"
jwt:
  secret: a-string-secret-at-least-256-bits-long
  expiration: 18000