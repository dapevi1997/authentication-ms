server:
  port: 8080
  error:
    include-message: always
spring:
  application:
    name: "AuthenticationMS"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
springdoc:
  swagger-ui:
    path: "/swagger-docs"
  api-docs:
    path: "/api-docs"
adapters:
  r2dbc:
    host: "localhost"
    port: 3306
    database: "authentication"
    schema: "schema.sql"
    username: "user"
    password: "password"